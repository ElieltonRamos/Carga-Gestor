<div class="hidden print:flex flex-col items-center gap-0 [page:etiqueta]">
  @for (label of labels(); track label.code + '-' + label.volumeIndex) {
    <app-label-card
      class="print:break-after-page print:last:break-after-auto"
      [label]="label"
      [companyName]="companyName()"
      [logo]="logo()"
    />
  }
</div>
