<div class="flex flex-col h-screen overflow-hidden bg-bg-base">
  <!-- TOP NAV -->
  <header
    class="h-16 shrink-0 flex items-center gap-6 px-6 bg-bg-sidebar border-b border-(--color-border)"
  >
    <!-- Logo -->
    <div class="flex items-center gap-2.5 shrink-0">
      <div
        class="w-8 h-8 rounded-lg avatar-gradient flex items-center justify-center text-(--color-text-inverse)"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 2 2 7v10l10 5 10-5V7z" />
        </svg>
      </div>
      <img src="icone-carga-gestor.png" alt="" class="h-10 w-auto shrink-0" />
      <span class="text-[15px] font-semibold text-(--color-text-primary)">Gestor de Carga</span>
    </div>
    <!-- Nav -->
    <nav class="flex-1 flex items-center gap-1 h-full">
      @for (item of nav; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="nav-active"
          class="flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] text-(--color-text-muted) hover:bg-bg-hover hover:text-(--color-text-primary) transition-all duration-150"
        >
          @switch (item.icon) {
            @case ('grid') {
              <svg
                class="w-4 h-4 shrink-0 opacity-80"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
              </svg>
            }
            @case ('package') {
              <svg
                class="w-4 h-4 shrink-0 opacity-80"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path d="m7.5 4.27 9 5.15" />
                <path
                  d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
                />
                <path d="m3.3 7 8.7 5 8.7-5" />
                <path d="M12 22V12" />
              </svg>
            }
            @case ('building') {
              <svg
                class="w-4 h-4 shrink-0 opacity-80"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />
                <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" />
                <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" />
                <path d="M10 6h4" />
                <path d="M10 10h4" />
                <path d="M10 14h4" />
                <path d="M10 18h4" />
              </svg>
            }
            @case ('settings') {
              <svg
                class="w-4 h-4 shrink-0 opacity-80"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
                />
              </svg>
            }
          }
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Right side -->
    <div class="flex items-center gap-2 shrink-0">
      <!-- Theme toggle -->
      <button
        (click)="toggleTheme()"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-(--color-text-muted) hover:bg-bg-hover hover:text-(--color-text-primary) transition-all"
        [attr.aria-label]="isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
      >
        @if (isDark()) {
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        } @else {
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>

      <!-- Logout -->
      <button
        (click)="logout()"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-(--color-text-muted) hover:bg-bg-hover hover:text-(--color-text-primary) transition-all"
        aria-label="Sair"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16,17 21,12 16,7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>

      <!-- User -->
      <div
        class="flex items-center gap-2 pl-1 pr-3 py-1 rounded-lg bg-bg-hover border border-(--color-border) cursor-pointer hover:bg-bg-hover-md transition-all"
      >
        <div
          class="w-7 h-7 rounded-md avatar-gradient flex items-center justify-center text-[11px] font-semibold text-(--color-text-inverse)"
        >
          {{ currentUser.initials }}
        </div>
        <div class="leading-tight">
          <p class="text-[11px] font-medium text-(--color-text-primary)">
            {{ currentUser.name }}
          </p>
          <p class="text-[9px] text-(--color-text-muted) uppercase tracking-wider">
            {{ currentUser.role }}
          </p>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 overflow-y-auto bg-bg-base relative">
    <div class="bg-grid absolute inset-0 pointer-events-none"></div>
    <div class="relative z-10 p-6">
      <router-outlet />
    </div>
  </main>
</div>
