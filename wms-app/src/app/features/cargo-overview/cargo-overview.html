<div class="max-w-5xl mx-auto p-6 flex flex-col gap-6">
<div class="flex justify-between items-center">
  <div>
    <h1 class="text-2xl font-bold text-text-primary">Acompanhamento de Carga</h1>
    <p class="text-sm text-text-secondary">Cargas em andamento e concluídas.</p>
  </div>
  <div class="flex items-center gap-4">
    <div class="flex gap-2 text-xs text-text-muted border-r border-border pr-4">
      <button
        type="button"
        (click)="resetAll()"
        class="underline hover:text-text-secondary transition-colors"
      >
        limpar dados de teste
      </button>
      <span>·</span>
      <button
        type="button"
        (click)="resetToMock()"
        class="underline hover:text-text-secondary transition-colors"
      >
        restaurar dados de teste
      </button>
    </div>
    <button
      type="button"
      (click)="goToNewCargo()"
      class="bg-btn-primary-bg text-btn-primary-text h-10 px-6 rounded font-semibold text-sm hover:bg-btn-primary-hover transition-colors"
    >
      Nova Carga
    </button>
  </div>
</div>

  <div class="flex items-center gap-3">
    <label class="text-xs font-bold tracking-wide text-text-secondary uppercase">
      Data do carregamento
    </label>
    <input
      type="date"
      [value]="dateFilter()"
      (change)="onDateChange($any($event.target).value)"
      class="h-10 px-3 rounded-input border border-input-border bg-input-bg text-input-text focus:border-input-border-focus focus:outline-none"
    />
    @if (dateFilter()) {
      <button
        type="button"
        (click)="clearFilter()"
        class="h-10 px-3 rounded border border-btn-secondary-border bg-btn-secondary-bg text-btn-secondary-text hover:bg-btn-secondary-hover transition-colors text-sm"
      >
        Ver todas as datas
      </button>
    }
  </div>

  <div class="flex flex-col gap-3">
    @for (entry of filteredCargos(); track entry.cargo.id) {
      <button
        type="button"
        (click)="goToCargo(entry.cargo.id)"
        class="text-left bg-bg-card border border-border rounded-card p-4 flex flex-col gap-3 hover:bg-bg-hover transition-colors"
      >
        <div class="flex justify-between items-start">
          <div>
            <h2 class="font-semibold text-text-primary">{{ entry.cargo.loadOrder }}</h2>
            <p class="text-xs text-text-secondary">
              {{ entry.cargo.loadDate }} · Motorista: {{ entry.cargo.driverName || '—' }}
            </p>
          </div>

          @if (entry.progress.status === 'complete') {
            <span class="text-xs font-bold px-2 py-1 rounded-badge bg-success-subtle text-success">
              Concluída
            </span>
          } @else if (entry.progress.status === 'partial') {
            <span class="text-xs font-bold px-2 py-1 rounded-badge bg-warning-subtle text-warning">
              Em andamento
            </span>
          } @else {
            <span
              class="text-xs font-bold px-2 py-1 rounded-badge bg-bg-surface text-text-secondary"
            >
              Pendente
            </span>
          }
        </div>

        <div class="flex flex-col gap-1">
          <div class="flex justify-between items-baseline">
            <span class="text-xs text-text-secondary">
              {{ entry.cargo.deliveries.length }} romaneio(s)
            </span>
            <span class="text-lg font-bold text-text-primary"
              >{{ entry.progress.percentage }}%</span
            >
          </div>
          <div class="h-2 rounded-full bg-bg-surface overflow-hidden">
            <div
              class="h-full transition-all duration-300"
              [class.bg-success]="entry.progress.status === 'complete'"
              [class.bg-warning]="entry.progress.status === 'partial'"
              [class.bg-text-muted]="entry.progress.status === 'pending'"
              [style.width.%]="entry.progress.percentage"
            ></div>
          </div>
        </div>
      </button>
    } @empty {
      <div class="bg-bg-card border border-border rounded-card p-6 text-center text-text-muted">
        Nenhuma carga nesta data.
      </div>
    }
  </div>
</div>
