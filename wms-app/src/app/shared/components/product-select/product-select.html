<div class="relative w-full">
  <input
    type="text"
    maxlength="191"
    autocomplete="off"
    [value]="term()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="open.set(false)"
    class="w-full h-9 px-2 pr-8 rounded-input border border-input-border bg-input-bg text-input-text text-base md:text-sm placeholder:text-input-placeholder focus:border-input-border-focus focus:outline-none disabled:opacity-50"
  />

  @if (loading()) {
    <div class="absolute right-2 top-1/2 -translate-y-1/2">
      <svg class="animate-spin h-4 w-4 text-text-muted" viewBox="0 0 24 24" aria-hidden="true">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
      </svg>
    </div>
  }

  @if (open() && !loading() && (options().length > 0 || failed() || term().trim())) {
    <div
      class="absolute z-50 w-full mt-1 bg-bg-card border border-border rounded-card shadow-lg overflow-hidden max-h-60 overflow-y-auto"
    >
      @for (product of options(); track product.id) {
        <button
          type="button"
          (mousedown)="$event.preventDefault(); select(product)"
          class="w-full px-3 py-2 text-left hover:bg-bg-hover transition-colors flex items-center gap-3 border-t border-border first:border-t-0"
        >
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-text-primary truncate">{{ product.name }}</p>
            <p class="text-xs text-text-secondary truncate">
              Cód. {{ product.id }}
              @if (product.weight !== null) {
                · {{ product.weight }} kg
              }
              @if (product.volumeCount !== null) {
                · {{ product.volumeCount }} vol./un.
              }
            </p>
          </div>
          @if (product.id === productId()) {
            <span class="text-xs text-primary shrink-0">Selecionado</span>
          }
        </button>
      } @empty {
        @if (failed()) {
          <div class="px-3 py-2 text-center text-danger text-sm">Erro ao buscar produtos</div>
        } @else {
          <div class="px-3 py-2 text-center text-text-muted text-sm">
            Nenhum produto encontrado. Será cadastrado ao salvar.
          </div>
        }
      }
    </div>
  }
</div>
